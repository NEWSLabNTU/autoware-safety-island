# Phase 1 nano-ros shim Kconfig overlay.
# Layered on top of prj_actuation.conf via EXTRA_CONF_FILE when
# build.sh runs with --nano-ros-shim. Enables the nano-ros Zephyr
# module + nros-cpp API + an RMW backend.
#
# Default backend is dust-dds (CONFIG_NROS_RMW_DDS=y) for first
# bring-up — no host router required. Switch to CONFIG_NROS_RMW_CYCLONEDDS=y
# once Phase 1D Cyclone-on-Zephyr glue lands in nano-ros-autoware.

CONFIG_NROS=y
CONFIG_NROS_CPP_API=y
CONFIG_NROS_RMW_DDS=y
CONFIG_NROS_DOMAIN_ID=0

# Phase 1 nano-ros shim Kconfig overlay.
# Layered on top of prj_actuation.conf via EXTRA_CONF_FILE when
# build.sh runs with --nano-ros-shim. Enables the nano-ros Zephyr
# module + nros-cpp API + an RMW backend.
#
# Default backend is dust-dds (CONFIG_NROS_RMW_DDS=y) for first
# bring-up — no host router required. Switch to CONFIG_NROS_RMW_CYCLONEDDS=y
# once Phase 1D Cyclone-on-Zephyr glue lands in nano-ros-autoware.

CONFIG_NROS=y
CONFIG_NROS_CPP_API=y
CONFIG_NROS_RMW_DDS=y
CONFIG_NROS_DOMAIN_ID=0

# Path to the nros-codegen binary used during CMake configure. The Zephyr
# nros_generate_interfaces() helper accepts the path via this Kconfig OR
# via the `-D_NANO_ROS_CODEGEN_TOOL=<path>` cmake cache var. We host-build
# the binary into modules/nros/build/install/bin/ as part of the dev-
# container shim bring-up (see scripts/build-nros-codegen-devcontainer.sh).
CONFIG_NROS_CODEGEN_TOOL="/autoware-safety-island/modules/nros/build/install/bin/nros-codegen"

# nros-platform-zephyr/src/net.c uses IP_ADD_MEMBERSHIP for SPDP multicast.
CONFIG_NET_IPV4_IGMP=y

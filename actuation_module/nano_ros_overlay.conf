# nano-ros Kconfig overlay — layered on top of the board confs via
# EXTRA_CONF_FILE for every Zephyr build (build.sh always appends it).
# Enables the nano-ros Zephyr module + nros-cpp API + the Cyclone RMW.
#
# Codegen tool path: NOT set here. build.sh passes
# `-D_NANO_ROS_CODEGEN_TOOL=<repo>/modules/nros/packages/cli/target/release/nros`,
# which wins over CONFIG_NROS_CODEGEN_TOOL (resolution order in
# modules/nros/zephyr/cmake/nros_generate_interfaces.cmake).
#
# Domain ID: NOT pinned here — CONFIG_NROS_CYCLONE_DOMAIN_ID defaults to
# NROS_DOMAIN_ID (nano-ros rule: a literal in a conf is the phase-180
# split-brain). The tap-network board conf overrides it to 2 deliberately
# to match the demo compose bridge.

CONFIG_NROS=y
CONFIG_NROS_CPP_API=y
CONFIG_NROS_RMW_CYCLONEDDS=y

# nros-platform-zephyr/src/net.c uses IP_ADD_MEMBERSHIP for SPDP multicast.
CONFIG_NET_IPV4_IGMP=y

# The nano-ros board conf (fvp-aemv8r-smp bundle) enables NET_TCP (Cyclone
# DDS), which on zephyr 3.7 y-selects NET_TCP_ISN_RFC6528 -> MBEDTLS_MD, whose
# Kconfig deps include a literal `&& 0` (can never enable) -> a broken select
# that aborts kconfig. We don't need RFC6528-compliant TCP ISNs for the FVP
# smoke; disable it (falls back to the simpler ISN, no mbedtls dependency).
CONFIG_NET_TCP_ISN_RFC6528=n

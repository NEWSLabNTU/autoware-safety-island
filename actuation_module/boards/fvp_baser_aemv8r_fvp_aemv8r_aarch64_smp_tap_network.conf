# DDS-over-TAP network configuration for FVP. The host side should assign tap0
# 192.168.10.1/24 and run CycloneDDS Domain 2 on that interface.
CONFIG_NET_DHCPV4=n
CONFIG_NET_IFACE1_ADDR="192.168.10.2"
CONFIG_NET_IFACE1_GW="192.168.10.1"
CONFIG_NET_IFACE1_NETMASK="255.255.255.0"

# The demo compose stack bridges DDS domain 2 (safety island) <-> 1 (Autoware)
# — see demo/bridge/bridge-config.yaml. The tap profile IS the demo profile,
# so pin the island domain here (the base nano_ros_overlay.conf keeps 0 for
# bench runs).
CONFIG_NROS_CYCLONE_DOMAIN_ID=2

# Wall-clock epoch for outgoing stamps (demo tap network): SNTP against the
# tap host. Without it stamps start at 1970 and Autoware vehicle_cmd_gate
# rejects the island commands as stale (autonomous mode never actuates).
# Serve with: scripts/sntp-server.py (unprivileged, port 12123).
CONFIG_ENABLE_SNTP=y
CONFIG_SNTP_SERVER_ADDRESS="192.168.10.1:12123"

# Re-sync OFF on this profile (boot epoch only).
#
# The FVP fast-forwards an idle guest, and it does so hard: measured here the
# guest clock ran ~100x real, so a periodic re-sync paced by ANY on-guest clock
# degenerates into a spin — 6184 re-syncs in nine real minutes at kernel pacing,
# 3609 at CLOCK_REALTIME pacing, each stepping the clock back ~10 s, with the
# boot thread starved so badly it never printed "Actuation Safety Island is
# Live". The guest has no real-time reference except the SNTP server itself,
# so pacing cannot be fixed from inside the guest without a control loop that
# learns the race factor from server-time deltas. Filed as a follow-up.
#
# A short mission runs fine on the boot epoch alone — that is the configuration
# the 2026-08-21 driving demo used. Long runs need the re-sync, and on silicon
# (ppm drift, no fast-forward) the interval is harmless.
CONFIG_ASI_SNTP_RESYNC_INTERVAL_S=0

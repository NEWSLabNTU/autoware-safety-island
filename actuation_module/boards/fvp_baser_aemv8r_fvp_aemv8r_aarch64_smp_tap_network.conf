# DDS-over-TAP network configuration for FVP. The host side should assign tap0
# 192.168.10.1/24 and run CycloneDDS Domain 2 on that interface.
CONFIG_NET_DHCPV4=n
CONFIG_NET_IFACE1_ADDR="192.168.10.2"
CONFIG_NET_IFACE1_GW="192.168.10.1"
CONFIG_NET_IFACE1_NETMASK="255.255.255.0"

# The demo compose stack bridges DDS domain 2 (safety island) <-> 1 (Autoware)
# — see demo/bridge/bridge-config.yaml. The tap profile IS the demo profile,
# so pin the island domain here (the base nano_ros_overlay.conf keeps 0 for
# bench runs).
CONFIG_NROS_CYCLONE_DOMAIN_ID=2

# Wall-clock epoch for outgoing stamps (demo tap network): SNTP against the
# tap host. Without it stamps start at 1970 and Autoware vehicle_cmd_gate
# rejects the island commands as stale (autonomous mode never actuates).
# Serve with: scripts/sntp-server.py (unprivileged, port 12123).
CONFIG_ENABLE_SNTP=y
CONFIG_SNTP_SERVER_ADDRESS="192.168.10.1:12123"

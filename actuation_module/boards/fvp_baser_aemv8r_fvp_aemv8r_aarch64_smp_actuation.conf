# DDS network interface
CONFIG_DDS_NETWORK_INTERFACE="ethernet"

# Control command output mode
CONFIG_CONTROL_CMD_OUTPUT_DDS_ONLY=y

# MDIO
CONFIG_MDIO=y

CONFIG_MDIO_INIT_PRIORITY=81
CONFIG_PHY_INIT_PRIORITY=82
# Use out of order priorities in order to work around a limitation in the
# SMSC91C111 driver in Zephyr.
CONFIG_ETH_INIT_PRIORITY=80
CONFIG_CHECK_INIT_PRIORITIES=n

# Zephyr system heap — MUST be set here, not in prj_actuation.conf.
#
# nano-ros 589a9d0 dropped CONFIG_HEAP_MEM_POOL_SIZE from 4 MiB to 192 KiB on
# this lane (an AN536 heap-default change that reached the FVP too). The
# controller exhausts 192 KiB during node construction: the image stops
# silently after "Time set using SNTP" and never reaches "Starting Controller
# Node" — no MALLOC FAILED, just nothing, for 300 s. Bisected to the pin with
# everything else held constant; the old pin boots, the new one does not.
#
# It lives in the BOARD conf because the nano-ros board bundle is merged AFTER
# prj_actuation.conf and would override it there — verified by grepping the
# built .config, which is the only reliable check for merge order.
CONFIG_HEAP_MEM_POOL_SIZE=4194304

# main thread stack. The boot tier runs the executor ON main (nano-ros runs
# tiers[0] on the calling thread), so the control callback — MPC + PID over
# Eigen — executes on this stack. MEASURED need, from the Layer 1 report on a
# working build: `main: STACK: unused 427904 usage 96384 / 524288 (18 %)`,
# i.e. 96 KB.
#
# nano-ros 589a9d0 cut the default to 16384. Init fits, so the image reaches
# "Actuation Safety Island is Live" and then dies on the FIRST control cycle:
# zero app_marker events in a capture where the old pin produced 5026, with no
# fault printed. Same class as the heap cut above.
CONFIG_MAIN_STACK_SIZE=524288

# The rest of the resource defaults nano-ros 589a9d0 cut on this lane. Two of
# that set were fatal on their own (the heap and the main stack, above); these
# four are not reached by an idle island but are exactly what real DDS traffic
# exercises, so they are restored as a set rather than discovered one demo run
# at a time. Old values, from a build that ran the controller for 5026 cycles:
#
#   MAX_PTHREAD_MUTEX_COUNT      1024 -> 32     cyclonedds takes one per entity
#   MAX_PTHREAD_COND_COUNT        512 -> 16
#   SYSTEM_WORKQUEUE_STACK_SIZE  8192 -> 4096   net stack runs work items here
#   NET_BUF_RX/TX_COUNT           128 -> 64     8.8 KiB trajectories fragment
#   NET_PKT_RX/TX_COUNT            64 -> 32
#
# The lane sizes its own budget; a board-family default should not silently
# resize a different board's.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=1024
CONFIG_MAX_PTHREAD_COND_COUNT=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64

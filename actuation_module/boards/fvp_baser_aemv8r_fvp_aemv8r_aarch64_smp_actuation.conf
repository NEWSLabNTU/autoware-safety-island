# DDS network interface
CONFIG_DDS_NETWORK_INTERFACE="ethernet"

# Control command output mode
CONFIG_CONTROL_CMD_OUTPUT_DDS_ONLY=y

# MDIO
CONFIG_MDIO=y

CONFIG_MDIO_INIT_PRIORITY=81
CONFIG_PHY_INIT_PRIORITY=82
# Use out of order priorities in order to work around a limitation in the
# SMSC91C111 driver in Zephyr.
CONFIG_ETH_INIT_PRIORITY=80
CONFIG_CHECK_INIT_PRIORITIES=n

# ---- Cyclone resource sizing, now OURS to declare ------------------------
#
# nano-ros 3d52070ec ("RMW snippet sizing becomes overridable, not absolute")
# moved these out of the nros-cyclonedds snippet and into Kconfig defaults a
# board may override. That was right for hardware — the snippet's numbers are
# host-scale, and an S32K344 with 320 KiB of SRAM could not argue with them —
# but it silently changed what THIS image resolves to, because the snippet had
# been supplying values ASI never declared:
#
#   COMMON_LIBC_MALLOC_ARENA_SIZE  16 MiB  ->  absent
#   HEAP_MEM_POOL_SIZE              4 MiB  ->  192 KiB
#   SYSTEM_WORKQUEUE_STACK_SIZE      8192  ->  4096
#   MAIN_STACK_SIZE               512 KiB  ->  32 KiB (prj_actuation.conf's own)
#
# The image then hung 1.16 s into boot with all four cores parked in WFI —
# an allocation that never completes, which reads as a hang and is not one.
# Bisected to that commit; restoring these values boots in 8 s.
#
# The FVP has 128 MB of RAM, so these are the historical host-scale numbers
# unchanged. A memory-constrained board must pick its own — that is exactly
# the freedom the upstream change bought.
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16777216
CONFIG_HEAP_MEM_POOL_SIZE=4194304
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# DDS network interface
CONFIG_DDS_NETWORK_INTERFACE="ethernet"

# Control command output mode
CONFIG_CONTROL_CMD_OUTPUT_DDS_ONLY=y

# MDIO
CONFIG_MDIO=y

CONFIG_MDIO_INIT_PRIORITY=81
CONFIG_PHY_INIT_PRIORITY=82
# Use out of order priorities in order to work around a limitation in the
# SMSC91C111 driver in Zephyr.
CONFIG_ETH_INIT_PRIORITY=80
CONFIG_CHECK_INIT_PRIORITIES=n

# Zephyr system heap — MUST be set here, not in prj_actuation.conf.
#
# nano-ros 589a9d0 dropped CONFIG_HEAP_MEM_POOL_SIZE from 4 MiB to 192 KiB on
# this lane (an AN536 heap-default change that reached the FVP too). The
# controller exhausts 192 KiB during node construction: the image stops
# silently after "Time set using SNTP" and never reaches "Starting Controller
# Node" — no MALLOC FAILED, just nothing, for 300 s. Bisected to the pin with
# everything else held constant; the old pin boots, the new one does not.
#
# It lives in the BOARD conf because the nano-ros board bundle is merged AFTER
# prj_actuation.conf and would override it there — verified by grepping the
# built .config, which is the only reliable check for merge order.
CONFIG_HEAP_MEM_POOL_SIZE=4194304

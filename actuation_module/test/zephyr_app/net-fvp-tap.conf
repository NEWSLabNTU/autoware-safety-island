#
# The FVP test programs' network on the tap network: what nros build renders
# for the fvp-tap* controller images from
# controller_bringup/zephyr/net-fvp-tap.toml (build/nros/net/<image>.conf). A
# test program is no bringup image, so it states the rendered rows itself.
# Keep the two in step.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.10.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.10.1"

#
# The FVP test programs' network on the model's user-mode network: what nros
# build renders for the controller images from
# controller_bringup/zephyr/net-fvp.toml (build/nros/net/<image>.conf). A test
# program is no bringup image, so it states the rendered rows itself. Keep
# the two in step.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""

# FVP Base RevC AEMv8-R SMP — Ethernet up via SMSC91C111.
# Mirrors actuation_module/boards/fvp_baser_aemv8r_smp_actuation.conf
# minus the ASI-specific DDS / CAN config.

CONFIG_MDIO=y
CONFIG_MDIO_INIT_PRIORITY=81
CONFIG_PHY_INIT_PRIORITY=82
# Out-of-order priorities work around an SMSC91C111 driver limitation.
CONFIG_ETH_INIT_PRIORITY=80
CONFIG_CHECK_INIT_PRIORITIES=n

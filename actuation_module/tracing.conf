# Real-time evaluation overlay — CTF task timeline + thread runtime stats.
# Layered by `./build.sh --trace` on top of the board confs. See
# docs/design/rt_evaluation_zephyr.rst for the analysis workflow and the
# caveats (32-bit ns timestamps wrap at ~4.29 s; the tracing buffer is
# irq_lock-protected only, so this fragment is valid ONLY on the
# CONFIG_SMP=n image the FVP lane builds).

# ---- CTF tracing --------------------------------------------------------
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y

# Async: the traced context only fills the buffer; a dedicated thread drains
# it to the backend. Sync mode would put UART writes on the hot path and
# destroy the timing being measured.
CONFIG_TRACING_SYNC=y
CONFIG_TRACING_BUFFER_SIZE=16384
CONFIG_TRACING_THREAD_STACK_SIZE=4096

# Event selection. Thread + ISR + timer are the task timeline; semaphore and
# mutex expose the executor contention that phase-4 round 1 chased. Syscall
# tracing is off (huge volume, nothing to say about scheduling), and the
# socket family is left at its default rather than force-enabled — turn it on
# deliberately when the question is about the DDS path.
CONFIG_TRACING_THREAD=y
CONFIG_TRACING_ISR=y
CONFIG_TRACING_TIMER=y
CONFIG_TRACING_SEMAPHORE=y
CONFIG_TRACING_MUTEX=y
CONFIG_TRACING_SYSCALL=n

# Socket tracing is OFF, and must stay off on this Zephyr pin. The CTF socket
# hooks in subsys/tracing/ctf/ctf_top.c dereference their arguments with no
# NULL check and without consulting the call's return value -- e.g.
# sys_trace_socket_getsockname_exit() does
#     net_addr_ntop(addr->sa_family, &net_sin(addr)->sin_addr, ...)
#     ... *addrlen ...
# so a getsockname() that fails (addr/addrlen NULL or unfilled) faults inside
# the tracer. Observed: the image dies during early boot in the
# `net_socket_service` thread, right after a socket_getsockname_enter event.
# The DDS path makes those calls constantly, so this is not a corner case here.
CONFIG_TRACING_NETWORKING=n

# Thread names are what make the trace readable: nano-ros names its RT tier
# threads via k_thread_name_set() in nros_zephyr_tier_task_create(), so
# [tiers.control] appears under its authored name instead of a bare TID.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

# ---- Single CPU: MANDATORY for CTF -------------------------------------
# Zephyr 3.7's tracing buffer is guarded by TRACING_LOCK(), which is a bare
# `irq_lock()` (subsys/tracing/include/tracing_core.h:17) -- not an SMP-safe
# critical section. And the CTF event header is `{uint32_t timestamp; uint8_t
# id;}` with NO cpu_id field, so events from several cores interleave with no
# way to separate them.
#
# The nano-ros board bundle turns SMP on (4 CPUs) AFTER prj_actuation.conf's
# CONFIG_SMP=n, so the shipped FVP image is multi-core. Tracing it verbatim
# faults during boot: a PC alignment exception on CPU 1 in net_socket_service
# with lr=0xaaaaaaaaaaaaaaaa. This fragment is merged last, so pinning one CPU
# here wins.
#
# CONSEQUENCE: a CTF capture measures the SINGLE-CORE scheduling of this
# workload, not the 4-core image CI ships. Read timelines with that in mind.
CONFIG_MP_MAX_NUM_CPUS=1

# ---- Transport: dedicated UART -----------------------------------------
# uart1 is enabled by the board dts and otherwise unused, so the CTF stream
# stays off the console. The chosen node lives in the companion overlay.
CONFIG_TRACING_BACKEND_UART=y

# ---- Scheduling statistics ---------------------------------------------
# Layered separately: ./build.sh --trace also applies tracing_stats.conf.
# See that file for the CONFIG_SCHED_THREAD_USAGE_ANALYSIS knobs.

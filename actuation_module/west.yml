# The west manifest file for the actuation Zephyr app.
#
# The per-installation west configuration file, .west/config, sets the
# path to the project containing this file in the [manifest] section's
# "path" variable.

---
manifest:
  defaults:
    remote: upstream

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos
    - name: newslab
      url-base: https://github.com/NEWSLabNTU

  #
  # Please add items below based on alphabetical order
  projects:
    - name: cmsis
      revision: 5a00331455dd74e31e80efa383a489faea0590e3
      path: actuation_module/zephyr_modules/hal/cmsis
      groups:
        - hal
    - name: hal_nxp
      revision: ad142f5612d927e29b1f9606e8edade871b8a526
      path: actuation_module/zephyr_modules/hal/hal_nxp
      groups:
        - hal
    # nano-ros: external dep providing the RMW + nros-cpp API + Zephyr module.
    # import: false is REQUIRED — nano-ros's own west.yml redefines zephyr at
    # v3.7.0 with a different module allowlist; importing recursively would
    # clobber the pin below. ASI stays the manifest authority; nano-ros is
    # consumed only as a leaf project whose zephyr/module.yml is auto-
    # discovered by the Zephyr module crawler.
    # LOCKSTEP: this revision must equal the modules/nros git submodule pointer.
    #
    # TEMPORARY: pinned to the head of NEWSLabNTU/nano-ros#40
    # (feat/callback-tracing), which carries the phase-8 callback-tracing
    # hooks ASI's tracing profile depends on. The branch is based on
    # nano-ros main, so this pin also advances 359 upstream commits past the
    # previous 589a9d0cf.
    #
    # MOVE THIS TO main ONCE #40 MERGES. A PR head is not a stable pin: the
    # branch can be rebased or deleted, and this revision would then be
    # unfetchable for anyone cloning fresh.
    - name: nano-ros
      remote: newslab
      revision: 54b9d9cbe9d2a2c730bc655b10aff37f0bbc2955
      path: modules/nros
      import: false
    # Pinned to v3.7.0 (LTS) to match nano-ros's board contract
    # (NROS_BOARD_ZEPHYR_LINE = 3.7) and its own west.yml zephyr pin. The
    # nano-ros platform-zephyr net code targets the 3.7+ net API
    # (net_if_addr.ipv4 wrapper, ip_mreq); an older line (3.5.x) drifts at
    # compile. Bump in lockstep with the zephyr-lang-rust rev below.
    - name: zephyr
      revision: v3.7.0
      west-commands: scripts/west-commands.yml
    # Zephyr Rust language support — REQUIRED: nano-ros's runtime is a Rust
    # staticlib linked into the Zephyr app via this module; without it
    # CONFIG_RUST is undefined and the nano-ros board conf's CONFIG_RUST(_ALLOC)
    # abort kconfig. Pin matches nano-ros's own west.yml (the supported
    # zephyr 3.7 x zephyr-lang-rust pair); bump in lockstep with the zephyr rev.
    - name: zephyr-lang-rust
      remote: upstream
      revision: 404fcefdbab0f2711cd342a1fab9d2eda52a1ba9
      path: modules/lang/rust

  group-filter:
    - -ci

  self:
    path: actuation_module

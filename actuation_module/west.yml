# The west manifest file for the actuation Zephyr app.
#
# The per-installation west configuration file, .west/config, sets the
# path to the project containing this file in the [manifest] section's
# "path" variable.

---
manifest:
  defaults:
    remote: upstream

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos
    - name: newslab
      url-base: https://github.com/NEWSLabNTU

  #
  # Please add items below based on alphabetical order
  projects:
    # cmsis and hal_nxp at the revisions Zephyr v3.7.0's own west.yml pins.
    # The nano-ros branch moved zephyr to v3.7.0 (below) and these two stayed at
    # the pins upstream uses with its older zephyr (339cd5a): the FVP build does
    # not use either, but the S32Z270 build then stopped at hal_nxp's
    # "SoC s32z270 not supported" (Zephyr 3.7 names the SoC s32z270, the old
    # hal_nxp knows s32z27).
    - name: cmsis
      revision: 4b96cbb174678dcd3ca86e11e1f24bc5f8726da0
      path: actuation_module/zephyr_modules/hal/cmsis
      groups:
        - hal
    - name: hal_nxp
      revision: 862e001504bd6e0a4feade6a718e9f973116849c
      path: actuation_module/zephyr_modules/hal/hal_nxp
      groups:
        - hal
    # nano-ros: external dep providing the RMW + nros-cpp API + Zephyr module.
    # import: false is REQUIRED — nano-ros's own west.yml redefines zephyr at
    # v3.7.0 with a different module allowlist; importing recursively would
    # clobber the pin below. ASI stays the manifest authority; nano-ros is
    # consumed only as a leaf project whose zephyr/module.yml is auto-
    # discovered by the Zephyr module crawler.
    # LOCKSTEP: this revision must equal the modules/nros git submodule pointer.
    #
    # ON main, 2026-11-21: 14be463e27, past PRs 4444 (the AN536 LAN9118 RX
    # drain), 4452, 4457 and 4491 (the platform CAN frame driver
    # <nros/platform_can.h>, the image's CAN device, fail-loud weak defaults
    # and the census CAN mock), 4472 (a transient-local subscription re-reads
    # a publisher cache), issue 2768 (the parameter store's value capacities
    # are no longer defaulted; system.toml states them), 4507 (issue 2785: a
    # Zephyr configure refuses a socket service stack below POLL_MAX *
    # sizeof(k_poll_event) + margin), 4504 (issue 2786: a conf fragment may
    # not set CONFIG_NROS_CAPABILITY_*), 4478 and 4484 (issues 2774, 2779: a
    # zenoh-pico client reopens when its router's TCP closes), 4517 (the
    # knob naming rule is enforced by the catalog loader) and 4518 (issue
    # 2702: an image's own features must equal [system]'s on a shared
    # configure). Cyclone is unchanged. Branch nano-ros-next only.
    #
    # Before that, ON main, 2026-11-20: 1866c0594f, past PRs 4423 (issue 2758: the RMW ABI
    # enums are int-wide on every target, so C and Rust agree on arm-none-eabi)
    # and 4430 (issue 2761: every RTOS runner takes nros_board_network_wait as
    # a weak reference, so a hand-written entry that never includes
    # rclc/detail/main.h links on FreeRTOS POSIX). Branch nano-ros-next only.
    #
    # Before that, ON main, 2026-11-20: 011a9c4c5b, past PRs 4414 (7eb34e188e, issue 2755:
    # Cyclone stores enum QoS fields at the ABI's enum size, so the AN536
    # controller's parameter services come up; arm-none-eabi enums are one
    # byte) and 4415 (issue 2753: `nros run --base-paths` keeps the image
    # argument). Branch nano-ros-next only.
    #
    # Before that, ON main, 2026-11-19: 93368ca929, past the issue 2704 fix (PRs 4223,
    # 4278: the Zephyr road generates the runtime's own rcl_interfaces types
    # for Cyclone, so the FVP image's parameter services come up). Branch
    # nano-ros-next only.
    #
    # Before that, ON main, 2026-11-18: 9afb5c8a19, past 4190 (575f694215, issue 2689:
    # SourceMetadata reads the schema v6 probe sidecar; on a49a8dacaf every
    # Zephyr C++ configure stopped at NanoRosPromise.cmake:402). Branch
    # nano-ros-next only.
    #
    # Before that, ON main, 2026-11-18: a49a8dacaf, past 4016 (67ba69c7ef, issue 2678:
    # nano_ros_add_plain_executable, a board build's host program), 4011
    # (41ffa35b7f, issue 2679: a Zephyr board network file renders into
    # NET_CONFIG_*), 4018 (a launch value of another type stops the boot),
    # 61364bbd78 and 7e9088d214 (the CAN frame driver's Zephyr backend, gated
    # behind a `can` feature). Branch nano-ros-next only.
    #
    # Before that, ON main, 2026-11-17: 5871cd6e45, past 4080 (89d696e5d7: nros build
    # passes its own -D_NANO_ROS_CODEGEN_TOOL), 4039 (f29f50aa0d: fabsl and
    # copysignl on newlib aarch64), 4086 (board s32z270-rtu0-zephyr, the
    # revision in west_board), 4066 (board-facts finds workspace board
    # packages), 4096 (board s32z270-freertos-rtd), 4090, 4095 and 4081
    # (play_launch 0.36.0, rlm v0.3.27). Branch nano-ros-next only.
    #
    # Before that, ON main, 2026-11-17: e845661f0b, past 4063 (phase-567 W4: an
    # island-shaped workspace in the merge queue) and 7f2e306c13 (issue 2644:
    # a C + Rust image with no C++ source configures and seeds its bounds).
    # Branch nano-ros-next only; the CLI comes from source automatically
    # (scripts/nros-cli.sh: modules/nros is not the release tag).
    #
    # Before that, ON main, 2026-11-16: ea94566e87, past PRs 4030 (a declaration with no
    # store slot stops the boot, issue 2634), 4034 (a launch list parameter
    # seeds as a typed array, 2638), 4042 (RCLCPP_*_THROTTLE / _ONCE /
    # _SKIPFIRST, 2636), 4043 (list_parameters past 64 names, 2639) and 4044
    # (the metadata probe's store is 1024, 2640). Branch nano-ros-next only,
    # built with NROS_DEV_CLI=1 (the release path refuses a checkout that is
    # not its tag); it moves to the nros12 tag, with nros-toolchain.toml,
    # when that release ships.
    #
    # Before that, RELEASE 0.6.0-nros11, 2026-11-16: 09219edc75, the commit tag
    # nros-0.6.0-nros11 names. The default build runs that release's prebuilt
    # CLI (actuation_module/nros-toolchain.toml pins it, scripts/nros-cli.sh);
    # this checkout must be the same commit, so a pin move changes all three
    # together. Work that needs nano-ros past this release waits on branch
    # nano-ros-next, built with NROS_DEV_CLI=1.
    #
    # Before that, ON main, 2026-11-16: 5b9e8844a4 (post-submit green), past PR 3972
    # (d814e77c0d): a generated Zephyr app keeps its workspace modules
    # (issue 3948) and finds the workspace's message packages (issue 3952).
    #
    # ON main, 2026-11-13: 8a71f9b34e, 84 commits past c229eae090, carrying
    # the four nano-ros PRs phase 13 C filed: 3703 (a depth-less subscription
    # row is priced at the budgeted depth: the arena is 94,840 B, not 1.39 MB),
    # 3704 (no host census of a launch-only owned entry), 3705 (the Zephyr boot
    # sched task's priority is read back and printed), 3709 (a board package
    # also on NROS_EXTRA_BOARD_PATH is one board; the S32Z270 Zephyr build).
    #
    # Before that, ON main, 2026-11-13: c229eae090, 1393 commits past 4fcc75d413 (main
    # 0a4cfcc063 plus nano-ros PRs 3640 and 3642, both found on this port).
    # Moves across phase-530 (`nros configure` replaces `nros sync`; every
    # hooked host configure runs it), phase-536 (tiers are sched tasks),
    # RFC-0121 D2 (a system.toml lives only in a bringup) and the stricter
    # promise and arena checks. See documentation/roadmap/phase-13-*.
    #
    # Before that, ON main, 2026-10-31: 4fcc75d413 (newest main with gate + post-submit
    # green), the step after 05b7f7d below.
    #
    # Before that, 2026-10-30: 05b7f7d2648f, the pin NEWSLabNTU/simple-autoware-
    # safety-island main runs (play_launch v0.20.2). Moves across nano-ros
    # phase-427 (ComponentNode merged into rclcpp::Node), phase-486 W8
    # ([deploy.*] -> [image.*]), phase-492/503 (C API -> rclc_*, C++ headers
    # -> <rclcpp/*>), and PR #2743 (no stale probe markers, issue 2097).
    #
    # ON main, 2026-09-05, carrying nano-ros #1062 — the fix that stops the
    # metadata probe from reading this repo's C++ controller as C. The pin it
    # replaced (91241878b) is an ancestor, so this only moves forward.
    #
    # Earlier, 2026-08-31. The three PRs that pin was waiting on are all in
    # main now, under different hashes because the merge queue rebases:
    #   #61 forward NROS_ZEPHYR_HEAP_SIZE to cargo  -> 6d95c1a8b
    #   #71 starvation says so; impossible sizes fail -> ee0d1933a
    #   #75 name chunks carry their handle           -> 0875ed688
    # (which is why GitHub shows #61 and #71 as CLOSED rather than merged).
    #
    # The previous revision, 13eb682fe, had been ORPHANED for the second time:
    # `fix/trace-names-bind-by-handle` no longer exists on the remote, so
    # `git branch -r --contains 13eb682fe` was empty and a fresh clone could
    # not fetch it. The build failed even WITH the commit in hand, because that
    # commit's Cargo.lock was stale against its own manifests and `--locked`
    # refused to update it. Two independent reasons the pin could not stand.
    #
    # The warning below is the rule that would have prevented both. It is kept
    # rather than deleted: pinning a branch is still allowed, and this is the
    # check that makes it safe.
    #
    # Anyone force-pushing a branch this file points at MUST repin in the same
    # change. `git branch -r --contains <rev>` in modules/nros is the check;
    # empty output means the pin is broken.
    #
    - name: nano-ros
      remote: newslab
      revision: 14be463e27e2e7ae9f09aa4c4df34f692956ef83
      path: modules/nros
      import: false
    # Pinned to v3.7.0 (LTS) to match nano-ros's board contract
    # (NROS_BOARD_ZEPHYR_LINE = 3.7) and its own west.yml zephyr pin. The
    # nano-ros platform-zephyr net code targets the 3.7+ net API
    # (net_if_addr.ipv4 wrapper, ip_mreq); an older line (3.5.x) drifts at
    # compile. Bump in lockstep with the zephyr-lang-rust rev below.
    - name: zephyr
      revision: v3.7.0
      west-commands: scripts/west-commands.yml
    # Zephyr Rust language support — REQUIRED: nano-ros's runtime is a Rust
    # staticlib linked into the Zephyr app via this module; without it
    # CONFIG_RUST is undefined and the nano-ros board conf's CONFIG_RUST(_ALLOC)
    # abort kconfig. Pin matches nano-ros's own west.yml (the supported
    # zephyr 3.7 x zephyr-lang-rust pair); bump in lockstep with the zephyr rev.
    - name: zephyr-lang-rust
      remote: upstream
      revision: 404fcefdbab0f2711cd342a1fab9d2eda52a1ba9
      path: modules/lang/rust

  group-filter:
    - -ci

  self:
    path: actuation_module

    # nano-ros's board fragment for s32z270-rtu0-zephyr (nano-ros issue 2880,
    # PR 4817): zephyr-lang-rust (REQUIRED: nano-ros's runtime is a Rust
    # staticlib linked through it; without it CONFIG_RUST is undefined and
    # the board conf aborts kconfig), hal_nxp (the S32Z270 SoC; "SoC s32z270
    # not supported" without it) and cmsis (Cortex-R headers), at the
    # revisions nano-ros builds the board with; nano-ros's
    # `just check zephyr-west-downstream` holds them to its own Zephyr pins.
    # The fragment names neither zephyr nor nano-ros, so the two entries above
    # stay this file's. It lands the modules at modules/lang/rust,
    # modules/hal/nxp and modules/hal/cmsis (Zephyr's own layout; hal_nxp and
    # cmsis were under actuation_module/zephyr_modules/hal/ before); the build
    # finds them through `west list`, not by path.
    # The file is read from the modules/nros checkout, so that submodule must
    # be checked out (`git submodule update --init modules/nros`) before
    # `west update`, at the LOCKSTEP revision above.
    import:
      - file: ../modules/nros/packages/boards/nros-board-zephyr/boards/s32z270-rtu0-zephyr/west-downstream.yml

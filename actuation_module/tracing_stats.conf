#
# Layer 1 of the real-time evaluation setup (docs/design/rt_evaluation_zephyr.rst):
# scheduling STATISTICS only, no CTF tracing. Cheap enough to leave on: the cost
# is per-context-switch cycle accounting plus an optional periodic printk.
#
# Kept separate from tracing.conf so the two layers can be enabled — and
# bisected — independently.

CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ANALYSIS=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y

# ---- Periodic emission --------------------------------------------------
# CONFIG_THREAD_ANALYZER provides thread_analyzer_print(); its AUTO mode is
# deliberately OFF because that worker prints before its first sleep behind a
# zero start delay, so the first dump lands during boot and breaks nros::init
# (the DDS loopback test fails -100 where the same image without it passes in
# 12.187 s; intervals of 5 s and 20 s fail identically). Filed upstream --
# docs/design/upstream-zephyr-issues.md issue 3.
#
# src/common/diag/thread_stats_report.c does the printing instead, from a
# thread with the start delay upstream lacks.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE=n

CONFIG_ASI_THREAD_STATS_REPORT=y
CONFIG_ASI_THREAD_STATS_START_DELAY=20
CONFIG_ASI_THREAD_STATS_INTERVAL=10
CONFIG_ASI_THREAD_STATS_MAX_REPORTS=3
CONFIG_ASI_THREAD_STATS_STACK_SIZE=16384

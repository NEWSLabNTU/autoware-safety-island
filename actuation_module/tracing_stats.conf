#
# Layer 1 of the real-time evaluation setup (docs/design/rt_evaluation_zephyr.rst):
# scheduling STATISTICS only, no CTF tracing. Cheap enough to leave on: the cost
# is per-context-switch cycle accounting plus an optional periodic printk.
#
# Kept separate from tracing.conf so the two layers can be enabled — and
# bisected — independently.

CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ANALYSIS=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y

# Layer 1 of the real-time evaluation setup (docs/design/rt_evaluation_zephyr.rst):
# scheduling STATISTICS only, no CTF tracing. Cheap enough to leave on: the cost
# is per-context-switch cycle accounting plus an optional periodic printk.
#
# Kept separate from tracing.conf so the two layers can be enabled — and
# bisected — independently.

CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ANALYSIS=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y

# ---- Periodic emission: NOT enabled, and why ----------------------------
# CONFIG_THREAD_ANALYZER would print the per-thread block on a timer, which is
# exactly what CI wants. It is off because CONFIG_THREAD_ANALYZER_AUTO breaks
# this application: the DDS loopback test fails `nros::init failed: -100`
# where the identical image without the analyzer passes in 12.187 s.
#
# The cause is not the interval. thread_analyzer_auto() is
#     for (;;) { thread_analyzer_print(); k_sleep(K_SECONDS(INTERVAL)); }
# behind a K_THREAD_DEFINE with a zero start delay, so the FIRST dump always
# lands during boot no matter how the interval is set -- intervals of 5 s and
# 20 s fail identically. The dump walks every thread and printks the result,
# which delays network init past a timeout inside nros.
#
# The statistics below are unaffected and CI-safe: measured against a control,
# a loopback run with them enabled passes at 12.187 s, the same as without.
# To emit them, call thread_analyzer_print() from the application AFTER init
# rather than from the auto thread -- that is the open follow-up.

# The unit_test test program (actuation_module/test/unit_test.cpp) as a nano-ros
# image, one per board that runs it. The image's entry is the program's own
# package, src/asi_tests/asi_unit_test, whose hand-written main() is the
# program, so `nros build` builds that package rather than generating an
# entry. The program prints "=== All Tests Passed ===" when every check passed
# and exits non-zero on a failed one, so `nros run --expect` grades it. CI
# runs it with .github/scripts/ci-helpers.sh's nros_run_program:
#
#   nros_run_program unit_test_bringup:mps3-an536-freertos asi_unit_test 120 \
#     "=== All Tests Passed ==="
#
# which is `nros run --plan` over the image's resolved plan plus its
# executable: `nros run unit_test_bringup:<board>` alone resolves no artifact
# for an image whose entry is a hand-written package.
#
# Each image is named after its board: the workspace configure of an image
# whose entry is a hand-written package resolves the board's facts by the
# board id (nano-ros sets NROS_DEPLOY to it), which must then be an image of
# this bringup. So each program has a bringup of its own, and the
# controller's image is named with its bringup
# (`controller_bringup:freertos-posix`): `freertos-posix` alone is now an
# image of three bringups.
#
# On the FVP (Zephyr) the entry is asi_unit_test_zephyr instead, a west
# application over the same source, and `nros run` alone runs it:
#
#   nros run unit_test_bringup:fvp-aemv8r-smp --expect ... --timeout N
#
# (the run target is the build dir's run_armfvp; the model parameters are
# the board's). That image is sized by the census of its program, as the
# FreeRTOS images are.

[system]
name      = "unit_test_bringup"
features  = ["param_services"]
rmw       = "cyclonedds"
domain_id = 0

# An image whose entry is a hand-written program is sized by that program's
# census, a host build of its package alone, run once; a census that cannot
# be taken refuses the build.

[image_defaults]
# The parameter store and the callback slots come from the program's census;
# the take buffer is not derived.
knobs.executor.subscription_buffer_bytes = 16384

# The FreeRTOS POSIX simulator, over host Cyclone DDS.
[image.freertos-posix]
board   = "freertos-posix"
entry   = "asi_unit_test"
profile = "RelWithDebInfo"

# QEMU mps3-an536 (emulated Cortex-R52), lwIP over the LAN9118.
[image.mps3-an536-freertos]
board   = "mps3-an536-freertos"
entry   = "asi_unit_test"
profile = "RelWithDebInfo"

# ARM FVP Base_RevC AEMv8-R, Zephyr, on the model's user-mode network. On
# Zephyr an owned entry is the west application, so the entry is
# asi_unit_test_zephyr, a package that finds Zephyr, over the same source. Its
# Kconfig is the controller's FVP image's (controller_bringup's [image.fvp]):
# the same fragments and board network file, so the test runs on the
# configuration the controller ships with. The model parameters (the SMSC
# NIC) are the board's ([board.run.fvp]); nros run starts the model.
# The os_config paths resolve from the west application's directory
# (src/asi_tests/asi_unit_test_zephyr); ../../ is src/ from there.
[image.fvp-aemv8r-smp]
board     = "fvp-aemv8r-smp"
entry     = "asi_unit_test_zephyr"
os_config = [
  "../../controller_bringup/zephyr/net-fvp.toml",
  "../../controller_bringup/zephyr/prj-actuation.conf",
  "../../controller_bringup/zephyr/prj-fvp.conf",
]
knobs.memory.heap_bytes = 8388608

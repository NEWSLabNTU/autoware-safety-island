# Phase 2.B — ASI controller system descriptor (nano-ros Bringup pkg).
#
# Schema: nano-ros `system.toml` v0.1 (FROZEN) —
# packages/cli/docs/system-toml-schema-v0.1.md / RFC-0004 §4.
# Pure-declarative: no Cargo.toml / CMakeLists.txt / src/ in this pkg.
#
# This file is the SSoT for the system's identity (name), RMW backend,
# ROS domain, default launch file, the composed node set, and the FVP
# images. It replaces the imperative knobs that used to live in
# main.cpp + Kconfig.

[system]
# MUST equal package.xml <name> (nros check cross-validates).
name           = "controller_bringup"
# Phase 4 (issue 0745): launch-param seeding rides the param-services
# capability (the parameter store lives behind it); this also registers
# the runtime get/set surface. Without it the entry cannot seed
# ctrl_period/control_output and the node runs on compiled defaults.
features       = ["param_services"]
# ASI runs Cyclone DDS on Zephyr (Phase 1 runtime). An [image.<id>] row
# may override per target; this is the system default.
rmw            = "cyclonedds"
# Default ROS_DOMAIN_ID. Embedded targets (FVP/Zephyr) BAKE this at build
# time (compile-time domain — see nano-ros CLAUDE.md "Domain ID").
domain_id      = 0
# Picked when the caller does not pass --launch / a `:<file>` suffix, and the
# launch file of every image below (none states its own).
default_launch = "system.launch.xml"
# What a bare `nros build` builds: the three emulated run lanes' images.
default_images = ["fvp", "freertos-posix", "an536"]

# The single ROS node ASI runs today. The 8 autoware component libraries
# are deps the Node pkg links, NOT nodes (roadmap gap I4), so they do not
# appear here.
#
#   pkg   — the Node pkg's package.xml <name> (must be an <exec_depend>).
#   class — fully-qualified component class; satisfies the I1 identity
#           rule `<pkg-dir>::<UserClass>` == controller_pkg::Controller.
#   name  — instance / node name (I2). The launch <node name=> mirrors it;
#           it overrides node_identity.hpp's DEFAULT_NODE_NAME = "controller".
# The census (a host build of the same launch file for the `linux` board,
# run once to count the entities the code really creates) is how nano-ros
# checks launch/system.contract.yaml against the code; a missing or stale
# census refuses the build. Its host image is [image.linux], below.
#
# The census boots the launch file's startup modes (neither
# trajectory_source nor supervision_mode is `vp`), so the two VisionPilot
# inputs, which the controller creates only in the VP modes, are not in it.
# The contract lists them so an image booted in a VP mode is sized for them;
# these waive the census's `phantom` rows for exactly those two.
[census.waive."controller:sub:/vehicle/driving_command"]
reason = "created only in supervision_mode=vp (VP_CONTROL); the census boots the launch file's default mode, and the contract sizes a VP boot"

[census.waive."controller:sub:/vehicle/driving_reference"]
reason = "created only with trajectory_source=vp; the census boots the launch file's default source, and the contract sizes a VP boot"

[[component]]
pkg   = "controller_pkg"
class = "controller_pkg::Controller"
name  = "controller"
# RFC-0047 (phase-4): the control timer's callback group rides the
# real-time tier below; subscriptions stay in the node's default context,
# so input deserialization (8.8 KiB trajectories) cannot stall the 30 ms
# control period. Measured before tiers on freertos-posix: ~12.4 Hz with
# 100-140 ms stalls against the 30 ms timer.
group_tasks = { control = "control" }

# The control tier. RAW per-platform priorities (nano-ros issue-0623 rule:
# tier and transport priorities are different units — keep the tier above
# the app-default task, and verify boot's report_tiers_above_transport).
[tasks.control]
class = "real_time"
# No `spin_period`: nano-ros derives it from the control timer's rate in
# launch/system.contract.yaml (33.333 Hz, the launch file's ctrl_period
# 0.03 s). The period is the spin loop's idle park timeout and the bound of
# the `release-jitter-runtime` rule; a 5 ms grid the task had no work on was
# missed by 6-9 ms on QEMU's mps3-an536 on every boot.
[tasks.control.freertos]
# freertos-posix board: configMAX_PRIORITIES = 10; app task default sits
# lower. RAW FreeRTOS priority.
priority = 7
[tasks.control.posix]
priority = 80
[tasks.control.zephyr]
# RAW Zephyr preemptive priority (lower number = higher priority).
#
# 9, not 5. nano-ros RFC-0079 allocated the Zephyr priority bands: the DDS
# transport sits at 7 and the tier pool is [8, 14], so 5 was ABOVE the
# transport — the control tier could preempt the very transport it depends on
# to receive trajectories and publish commands. That was recorded upstream as
# a COLLIDES violation and closed in nano-ros's own bringups by moving 5 -> 9
# (`feat(RFC-0079): Zephyr's four violations closed`, pin 957c2b3ed); this
# consumer bringup had to follow.
#
# 9 keeps the tier inside the resolved pool and still more urgent than a
# `low` tier at 10. Zephyr's band is DERIVED, so the pool is a property of
# THIS image's .config rather than of the port.
#
# The single declared tier is the boot tier, which nano-ros runs on the
# CALLING thread rather than a spawned one (entry_tiers.rs: "the boot thread
# runs tiers[0] itself"), so this value lands on `main` via
# k_thread_priority_set(). Note Zephyr 3.7 has no tracing hook in
# z_impl_k_thread_priority_set(), so the change does not appear in a CTF
# capture — see documentation/design/upstream-zephyr-issues.md issue 4.
priority = 9

# Images (nano-ros phase-486 W8 retired `[deploy.<t>]`; each target is now an
# `[image.<id>]` row naming a nano-ros BOARD id). build.sh maps its flags to
# an id and runs `nros build <id>`.

# Zephyr images. `nros build <id>` generates the west application
# (build/zephyr-cyclonedds/<id>_entry/); build.sh picks the id from its flags
# (--network tap, --trace-stats, --trace, --trace-ring). Each image's Zephyr
# settings are os_config fragments under zephyr/, applied after the board
# package's own files: the application's settings (prj-actuation.conf), the
# board's (prj-fvp.conf, prj-s32z.conf), then the network and real-time
# evaluation layers. The fragments assign asi_common's Kconfig symbols, which
# asi_common defines as a Zephyr module.
#
# FVP model parameters: fvp-aemv8r-smp states the SMSC 91C111 NIC (enabled,
# promiscuous) for every image; an image adds its own in [image.<id>.run]:
# `nic = { tap = "tap0" }` (the host bridge's TAP mode; the tap images) and
# `fvp.params` (the trace images send uart1, the CTF stream, to trace.ctf in
# the build directory, where the model runs). nros build hands them to
# Zephyr's armfvp.cmake at configure (nano-ros issue 2629), so a change
# re-configures the image. A TAP other than tap0 is a change of these rows.
#
# The sizing knobs every image shares ([image_defaults] below); an image
# block states only what differs from them. The FVP images also state
# memory.heap_bytes = 8 MiB (the nros allocator funnel, z_malloc and
# __rust_alloc, holds Cyclone and the controller). It cannot be a default:
# [image_defaults] reaches every image, and on the S32Z270 it would override
# its board package's heap (2 MiB).

[image_defaults]
# No knobs.params.max_parameters: nano-ros derives the store from what the
# controller declares (150 parameters, trajectory follower + MPC lateral +
# PID longitudinal + vehicle info + can_format, plus use_sim_time: 151
# slots). A stated
# value would win over the derived one.
# The parameter store's value capacities are a board fact nano-ros no longer
# defaults (issue 2768): the controller declares string parameters
# (control_output, supervision_mode, ...) and double arrays (the MPC
# steer-rate limits). These are the sizes every image ran with before.
knobs.params.max_string_value_bytes = 256
knobs.params.max_array_len = 32
# No knobs.executor.max_cbs: nano-ros derives the callback slots from the
# contract the census checks (9 subscriptions, the control timer and the
# node interfaces). subscription_buffer_bytes = 16384: /planning
# trajectories run 9-14 KiB, and an undersized buffer drops the sample after
# Cyclone ACKed it (nano-ros issue 0749); nano-ros keeps the take buffer at
# its configured value. The two ARMv8-R FreeRTOS images take 64 KiB.
knobs.executor.subscription_buffer_bytes = 16384

# The wall clock (phase-15 P5). nano-ros resolves the image's [knobs.clock]
# source once and keeps it as an offset from the monotonic clock. Every
# outgoing stamp reads it (common/clock/clock.hpp); input ages and timeouts
# read the monotonic clock instead. Images that state no source take
# `platform`: the host's clock on the FreeRTOS POSIX simulator and the
# census's linux images.
#
# Zephyr resolves at boot, after the controller has registered and before
# anything spins; the island runs no SNTP of its own there. Per network:
#   - tap images (the demo stack): SNTP from scripts/sntp-server.py on the
#     tap host, and `halt` when it never answers, as the island's network
#     hook did (std::exit(1)): every command carries this clock, and
#     vehicle_cmd_gate rejects a boot-relative stamp as stale, so an island
#     that boots on would look alive and actuate nothing. 10 attempts of 60 s
#     guest time each, the hook's retry count and timeout: the FVP races an
#     idle guest's clock (~10x), so a shorter guest timeout expires before the
#     reply and the late reply panicked the net stack (NET_ASSERT).
#   - s32z: SNTP and `halt`, for the same reason; the server is the one the
#     island's SNTP Kconfig named by default. A deployment states its own.
#   - the user-mode FVP images (CI): SNTP through the model's NAT, falling
#     back to `platform` (no wall clock on Zephyr: stamps boot-relative, the
#     default `unstamped` policy). The lane's network is the host's, so a
#     time server is not something it can promise; `halt` there would make
#     CI depend on the internet. The server is an address (time.google.com's
#     216.239.35.0): the model's DHCP hands the guest no DNS server, so a
#     host name fails every attempt at once (rc -22, measured). NOTE: on Zephyr `platform` always answers,
#     so a fallback list that ends in it never halts; a `halt` image names
#     sntp alone.
# No image re-queries the server (clock.sntp_resync_interval_ms stays at its
# default 0, one exchange at boot), so the stamp clock advances on the
# monotonic clock after it latches:
#   - FVP images: nano-ros paces the re-query with k_msleep, guest time, and
#     the model races an idle guest (measured ~10x to ~100x real). The
#     island's own re-sync thread, paced the same way, ran 6184 re-syncs in
#     nine real minutes and starved the boot; the tap images ran it off.
#   - s32z: silicon drift is ppm-level, so the boot epoch is good for the
#     length of a drive, and the image is link-only: a re-sync thread there
#     (nano-ros's runs on a fixed 2048-byte stack; the island's own one,
#     around the same sntp_simple call, measured 7024 bytes on the FVP)
#     cannot be checked on it.
# clock.upgrade stays `never` (the default): it decides whether a source
# EARLIER in clock.source may replace the latched one after boot. The tap and
# s32z images name one source; on the user-mode FVP images nothing re-queries
# sntp after boot, so a latched `platform` has nothing to upgrade to.
#
# Bare-metal FreeRTOS (an536, s32z2) has no clock of its own (its `platform`
# never answers) and nano-ros has no SNTP client on lwIP, so these images
# take `board`: nano-ros's board hook over the island's SNTP task
# (asi_common/src/platform/freertos/board_wall_clock.cpp), which queries the
# image's gateway on port 12123 (scripts/sntp-server.py). nano-ros resolves it
# on the first wall-clock read, which waits for the answer, so no entity is
# created on one clock and run on another. Both images state:
#   - fallback_settle_ms = 6000: the old island task's bounded boot wait (60
#     x 100 ms), room for two of its 2 s queries after a lost first one; a
#     reachable responder answers the first query in well under a second.
#   - epoch_failure = "unstamped" (the default, stated): the old task's
#     failure policy. When no epoch came it logged and booted on, stamping
#     boot-relative (Clock::now() still does: nano-ros reads 0 and it falls
#     back to the monotonic clock). The AN536 CI lane serves the responder on
#     its user network's gateway; the s32z2 image is link-only, and its
#     server is the deployment's to state (ASI_SNTP_SERVER_IP).
# `board` is asked only until it answers, so these images do not re-sync
# either; their epoch advances on the monotonic clock, like the Zephyr ones.

# The FVP image: ARM FVP Base_RevC AEMv8-R, Zephyr, user-mode networking.
[image.fvp]
board     = "fvp-aemv8r-smp"
os_config = [
  "zephyr/net-fvp.toml",
  "zephyr/prj-actuation.conf",
  "zephyr/prj-fvp.conf",
]
knobs.memory.heap_bytes = 8388608
knobs.clock.source = "sntp,platform"
knobs.sntp.server = "216.239.35.0"

# Layer 1 of the real-time evaluation (documentation/design/rt_evaluation_zephyr.rst):
# thread runtime statistics, no CTF (build.sh --trace-stats).
[image.fvp-stats]
board     = "fvp-aemv8r-smp"
os_config = [
  "zephyr/net-fvp.toml",
  "zephyr/prj-actuation.conf",
  "zephyr/prj-fvp.conf",
  "zephyr/prj-trace-stats.conf",
]
knobs.memory.heap_bytes = 8388608
knobs.clock.source = "sntp,platform"
knobs.sntp.server = "216.239.35.0"

# CTF tracing streamed to uart1, plus the Layer 1 statistics (build.sh --trace).
[image.fvp-trace]
board     = "fvp-aemv8r-smp"
os_config = [
  "zephyr/net-fvp.toml",
  "zephyr/prj-actuation.conf",
  "zephyr/prj-fvp.conf",
  "zephyr/prj-trace-stats.conf",
  "zephyr/prj-trace.conf",
  "zephyr/fvp-trace.overlay",
]
knobs.memory.heap_bytes = 8388608
knobs.clock.source = "sntp,platform"
knobs.sntp.server = "216.239.35.0"
run.fvp.params = ["bp.pl011_uart1.out_file=trace.ctf"]

# CTF into an overwrite-oldest RAM ring (build.sh --trace-ring). The ring
# fragment comes after prj-trace.conf: it switches the UART backend off.
[image.fvp-trace-ring]
board     = "fvp-aemv8r-smp"
os_config = [
  "zephyr/net-fvp.toml",
  "zephyr/prj-actuation.conf",
  "zephyr/prj-fvp.conf",
  "zephyr/prj-trace-stats.conf",
  "zephyr/prj-trace.conf",
  "zephyr/prj-trace-ring.conf",
  "zephyr/fvp-trace.overlay",
]
knobs.memory.heap_bytes = 8388608
knobs.clock.source = "sntp,platform"
knobs.sntp.server = "216.239.35.0"
run.fvp.params = ["bp.pl011_uart1.out_file=trace.ctf"]

# The four tap images are one host built four ways, never booted together:
# they share net-fvp-tap.toml's static address (nano-ros RFC-0136).
[image_alternatives]
fvp-tap = ["fvp-tap", "fvp-tap-stats", "fvp-tap-trace", "fvp-tap-trace-ring"]

# The FVP image on the TAP network (build.sh --network tap), for the demo
# stack: Autoware on domain 1, the island on 2, `domain_bridge` between them.
[image.fvp-tap]
board     = "fvp-aemv8r-smp"
domain_id = 2
os_config = [
  "zephyr/net-fvp-tap.toml",
  "zephyr/prj-actuation.conf",
  "zephyr/prj-fvp.conf",
  "zephyr/prj-fvp-tap.conf",
]
knobs.memory.heap_bytes = 8388608
knobs.clock.source = "sntp"
knobs.clock.epoch_failure = "halt"
knobs.clock.sntp_attempts = 10
knobs.sntp.server = "192.168.10.1:12123"
knobs.sntp.timeout_ms = 60000
run.nic = { tap = "tap0" }

# [image.fvp-stats] on the TAP network.
[image.fvp-tap-stats]
board     = "fvp-aemv8r-smp"
domain_id = 2
os_config = [
  "zephyr/net-fvp-tap.toml",
  "zephyr/prj-actuation.conf",
  "zephyr/prj-fvp.conf",
  "zephyr/prj-fvp-tap.conf",
  "zephyr/prj-trace-stats.conf",
]
knobs.memory.heap_bytes = 8388608
knobs.clock.source = "sntp"
knobs.clock.epoch_failure = "halt"
knobs.clock.sntp_attempts = 10
knobs.sntp.server = "192.168.10.1:12123"
knobs.sntp.timeout_ms = 60000
run.nic = { tap = "tap0" }

# [image.fvp-trace] on the TAP network.
[image.fvp-tap-trace]
board     = "fvp-aemv8r-smp"
domain_id = 2
os_config = [
  "zephyr/net-fvp-tap.toml",
  "zephyr/prj-actuation.conf",
  "zephyr/prj-fvp.conf",
  "zephyr/prj-fvp-tap.conf",
  "zephyr/prj-trace-stats.conf",
  "zephyr/prj-trace.conf",
  "zephyr/fvp-trace.overlay",
]
knobs.memory.heap_bytes = 8388608
knobs.clock.source = "sntp"
knobs.clock.epoch_failure = "halt"
knobs.clock.sntp_attempts = 10
knobs.sntp.server = "192.168.10.1:12123"
knobs.sntp.timeout_ms = 60000
run.nic = { tap = "tap0" }
run.fvp.params = ["bp.pl011_uart1.out_file=trace.ctf"]

# [image.fvp-trace-ring] on the TAP network.
[image.fvp-tap-trace-ring]
board     = "fvp-aemv8r-smp"
domain_id = 2
os_config = [
  "zephyr/net-fvp-tap.toml",
  "zephyr/prj-actuation.conf",
  "zephyr/prj-fvp.conf",
  "zephyr/prj-fvp-tap.conf",
  "zephyr/prj-trace-stats.conf",
  "zephyr/prj-trace.conf",
  "zephyr/prj-trace-ring.conf",
  "zephyr/fvp-trace.overlay",
]
knobs.memory.heap_bytes = 8388608
knobs.clock.source = "sntp"
knobs.clock.epoch_failure = "halt"
knobs.clock.sntp_attempts = 10
knobs.sntp.server = "192.168.10.1:12123"
knobs.sntp.timeout_ms = 60000
run.nic = { tap = "tap0" }
run.fvp.params = ["bp.pl011_uart1.out_file=trace.ctf"]

# The S32Z270 RTU0 R52 on Zephyr (build.sh --platform zephyr-s32z, release
# only; no emulator models this SoC). The board is nano-ros's
# s32z270-rtu0-zephyr (west_board s32z2xxdc2@D/s32z270/rtu0, revision D in the
# board string; nano-ros PR 4086), which also states the image's heap (2 MiB).
# What the board leaves to the image is stated here: CONFIG_MAIN_STACK_SIZE
# and the C++ runtime (zephyr/prj-actuation.conf; the S32ZE SoC default of
# 1024 would win otherwise), and hal_nxp in actuation_module/west.yml.
[image.s32z]
board     = "s32z270-rtu0-zephyr"
os_config = ["zephyr/prj-actuation.conf", "zephyr/prj-s32z.conf"]
knobs.clock.source = "sntp"
knobs.clock.epoch_failure = "halt"
knobs.clock.sntp_attempts = 10
knobs.sntp.server = "time.nist.gov"

# Phase 4 W5.a -- FreeRTOS POSIX simulator (nano-ros phase-370 board). The
# controller runs as a FreeRTOS TASK under the scheduler the board's main()
# starts -- over HOST CycloneDDS sockets. No netstack/site block: the board
# declares supported_netstacks = [] (the host kernel owns the stack);
# FREERTOS_DIR flows via env at configure time.
[image.freertos-posix]
board = "freertos-posix"
# RelWithDebInfo (-O2 -g), the profile the FreeRTOS images were always built
# with; the CMake road defaults to Release (-O3, ~130 KB more text on an536).
profile = "RelWithDebInfo"
# The CAN frame device the controller's CAN output opens (RFC-0132 D4: on a
# host-stack board the image names it; SocketCAN). Used only in a CAN mode
# (launch arg control_output); vcan0 is the demo's and the CARLA bridge's.
[image.freertos-posix.can]
device = "vcan0"

# The host image the census builds and runs for every cross image that
# states no `args`: the same launch file, on nano-ros's `linux` board.
[image.linux]
board = "linux"
[image.linux.can]
device = "vcan0"

# The binding variant the CARLA image resolves (nano-ros: a launch resolved
# with arguments must be declared here).
[[model]]
launch = "system.launch.xml"
out    = "system_carla_model.yaml"
args   = { wheel_base = "3.005", max_pitch_rad = "0.2", min_pitch_rad = "-0.2" }

# The FreeRTOS POSIX simulator for the CARLA integration run
# (integration/carla/): the same image, bound to the CARLA ego's vehicle
# (swb's tesla_model3) and swb's CARLA PID pitch limits.
[image.freertos-posix-carla]
board   = "freertos-posix"
profile = "RelWithDebInfo"
args    = { wheel_base = "3.005", max_pitch_rad = "0.2", min_pitch_rad = "-0.2" }
[image.freertos-posix-carla.can]
device = "vcan0"

# The census's host image for [image.freertos-posix-carla]: a census is taken
# from a host image resolved from the same launch file and arguments.
[image.linux-carla]
board = "linux"
args  = { wheel_base = "3.005", max_pitch_rad = "0.2", min_pitch_rad = "-0.2" }
[image.linux-carla.can]
device = "vcan0"

# Phase 4 W5.b -- NXP S32Z270 RTU (Cortex-R52) on FreeRTOS via the nano-ros
# phase-372 board bundle. Cross target: link-complete with the in-tree
# GCC/ARM_CRx_No_GIC port; hardware runs the NXP-provisioned GCC/ARM_CR52_GIC
# port + the RTD NETC glue (src/s32z2_board_glue, env-gated on the NXP SDK).
[image.s32z2]
board   = "s32z270-freertos"
profile = "RelWithDebInfo"
# 64 KiB. A real Autoware trajectory serialises to ~13 KiB, and an undersized
# subscription buffer drops the sample silently after Cyclone ACKed it
# (nano-ros issue 0749).
knobs.executor.subscription_buffer_bytes = 65536
# The wall clock: see the clock notes above [image.fvp].
knobs.clock.source = "board"
knobs.clock.fallback_settle_ms = 6000
knobs.clock.epoch_failure = "unstamped"

# phase-6 A2 -- the EMULATED Cortex-R52 lane (QEMU mps3-an536, nano-ros
# phase-385). Same CPU and kernel port as [image.s32z2] above, but nothing
# about it is licensed or hardware-gated: it boots, schedules on a GICv3 +
# generic-timer tick, and runs CycloneDDS over an emulated LAN9118. It exists
# so the ARMv8-R code path -- which the S32Z2 lane can only LINK today -- has
# runtime coverage in CI without a board.
[image.an536]
board = "mps3-an536-freertos"
# Domain 2 for the demo stack (Autoware on 1, island on 2, `domain_bridge`
# relaying between them), as [image.fvp-tap]. `nros build an536` generates the
# entry with it (nano-ros issue 3856 was about a hand-written entry dropping
# it).
domain_id = 2
profile   = "RelWithDebInfo"
# 64 KiB. A real Autoware trajectory serialises to ~13 KiB, and an undersized
# subscription buffer drops the sample silently after Cyclone ACKed it
# (nano-ros issue 0749).
knobs.executor.subscription_buffer_bytes = 65536
# The wall clock: see the clock notes above [image.fvp].
knobs.clock.source = "board"
knobs.clock.fallback_settle_ms = 6000
knobs.clock.epoch_failure = "unstamped"

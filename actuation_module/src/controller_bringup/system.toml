# Phase 2.B — ASI controller system descriptor (nano-ros Bringup pkg).
#
# Schema: nano-ros `system.toml` v0.1 (FROZEN) —
# packages/cli/docs/system-toml-schema-v0.1.md / RFC-0004 §4.
# Pure-declarative: no Cargo.toml / CMakeLists.txt / src/ in this pkg.
#
# This file is the SSoT for the system's identity (name), RMW backend,
# ROS domain, default launch file, the composed node set, and the FVP
# deploy target. It replaces the imperative knobs that used to live in
# main.cpp + Kconfig.

[system]
# MUST equal package.xml <name> (nros check cross-validates).
name           = "controller_bringup"
# Phase 4 (issue 0745): launch-param seeding rides the param-services
# capability (the parameter store lives behind it); this also registers
# the runtime get/set surface. Without it the entry cannot seed
# ctrl_period/control_output and the node runs on compiled defaults.
features       = ["param_services"]
# ASI runs Cyclone DDS on Zephyr (Phase 1 runtime). A [deploy.<t>] block
# may override per target; this is the system default.
rmw            = "cyclonedds"
# Default ROS_DOMAIN_ID. Embedded targets (FVP/Zephyr) BAKE this at build
# time (compile-time domain — see nano-ros CLAUDE.md "Domain ID").
domain_id      = 0
# Picked when the caller does not pass --launch / a `:<file>` suffix.
default_launch = "system.launch.xml"

# The single ROS node ASI runs today. The 8 autoware component libraries
# are deps the Node pkg links, NOT nodes (roadmap gap I4), so they do not
# appear here.
#
#   pkg   — the Node pkg's package.xml <name> (must be an <exec_depend>).
#   class — fully-qualified component class; satisfies the I1 identity
#           rule `<pkg-dir>::<UserClass>` == controller_pkg::Controller.
#   name  — instance / node name (I2). The launch <node name=> mirrors it;
#           it overrides node_identity.hpp's DEFAULT_NODE_NAME = "controller".
[[component]]
pkg   = "controller_pkg"
class = "controller_pkg::Controller"
name  = "controller"
# RFC-0047 (phase-4): the control timer's callback group rides the
# real-time tier below; subscriptions stay in the node's default context,
# so input deserialization (8.8 KiB trajectories) cannot stall the 30 ms
# control period. Measured before tiers on freertos-posix: ~12.4 Hz with
# 100-140 ms stalls against the 30 ms timer.
group_tiers = { control = "control" }

# The control tier. RAW per-platform priorities (nano-ros issue-0623 rule:
# tier and transport priorities are different units — keep the tier above
# the app-default task, and verify boot's report_tiers_above_transport).
[tiers.control]
class = "real_time"
spin_period_us = 5000
[tiers.control.freertos]
# freertos-posix board: configMAX_PRIORITIES = 10; app task default sits
# lower. RAW FreeRTOS priority.
priority = 7
[tiers.control.posix]
priority = 80
[tiers.control.zephyr]
# RAW Zephyr preemptive priority (lower number = higher priority).
priority = 5

# FVP deploy target — ARM FVP Base_RevC AEMv8-R Cortex-A SMP, Zephyr.
# board cross-refs the `nros-board-fvp-aemv8r-smp` crate (Phase 215
# nano_ros_use_board(fvp-aemv8r-smp), wired by the Phase 2.C Entry pkg).
[deploy.fvp]
kind   = "zephyr"
target = "fvp_baser_aemv8r_smp"
board  = "fvp-aemv8r-smp"
launch = "system.launch.xml"

# Phase 4 W5.a — FreeRTOS POSIX simulator (nano-ros phase-370 board).
# kind "embedded", not "self": the controller runs as a FreeRTOS TASK under
# the scheduler the board's main() starts — over HOST CycloneDDS sockets.
# No netstack/site block: the board declares supported_netstacks = [] (the
# host kernel owns the stack); FREERTOS_DIR flows via env at configure time.
[deploy.freertos-posix]
kind  = "embedded"
board = "freertos-posix"

# Phase 4 W5.b — NXP S32Z270 RTU (Cortex-R52) on FreeRTOS via the nano-ros
# phase-372 board bundle. Cross target: link-complete with the in-tree
# GCC/ARM_CRx_No_GIC port; hardware runs the NXP-provisioned GCC/ARM_CR52_GIC
# port + the RTD NETC glue (src/s32z2_board_glue, env-gated on the NXP SDK).
[deploy.s32z2]
kind  = "embedded"
board = "s32z270-freertos"

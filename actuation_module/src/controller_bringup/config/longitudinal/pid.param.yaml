#
# PID longitudinal controller (autoware_launch's
# config/control/trajectory_follower/longitudinal/pid.param.yaml shape). The
# stop and emergency limits are the actuation profile's, in
# pid_profile_<profile>.param.yaml. max_pitch_rad / min_pitch_rad are launch
# args: an image binds them (the CARLA profile's +-0.2 rad).
#
# Loaded by launch/system.launch.xml (<param from>) and baked into every
# image at build time; these values are what the island runs with. The C++
# declare_parameter() defaults state the same values only because nano-ros's
# metadata probe constructs the node with no launch values (phase 15 P3).
# .github/scripts/check-param-seeds.py checks that every declared parameter
# is seeded here or in the launch file, with a value of its declared type:
# every double is a float literal (1.0, not 1).
/**:
  ros__parameters:
    delay_compensation_time: 0.17
    enable_smooth_stop: true
    enable_overshoot_emergency: true
    enable_large_tracking_error_emergency: true
    enable_slope_compensation: true
    enable_keep_stopped_until_steer_convergence: true
    drive_state_stop_dist: 0.5
    drive_state_offset_stop_dist: 1.0
    stopping_state_stop_dist: 0.5
    stopped_state_entry_duration_time: 0.1
    stopped_state_entry_vel: 0.01
    stopped_state_entry_acc: 0.1
    emergency_state_overshoot_stop_dist: 1.5
    emergency_state_traj_trans_dev: 3.0
    emergency_state_traj_rot_dev: 0.7854
    kp: 1.0
    ki: 0.1
    kd: 0.0
    max_out: 1.0
    min_out: -1.0
    max_p_effort: 1.0
    min_p_effort: -1.0
    max_i_effort: 0.3
    min_i_effort: -0.3
    max_d_effort: 0.0
    min_d_effort: 0.0
    lpf_vel_error_gain: 0.9
    enable_integration_at_low_speed: false
    current_vel_threshold_pid_integration: 0.5
    time_threshold_before_pid_integration: 2.0
    enable_brake_keeping_before_stop: false
    brake_keeping_acc: -0.2
    smooth_stop_max_strong_acc: -0.5
    smooth_stop_min_strong_acc: -0.8
    smooth_stop_weak_acc: -0.3
    smooth_stop_weak_stop_acc: -0.8
    smooth_stop_strong_stop_acc: -3.4
    smooth_stop_max_fast_vel: 0.5
    smooth_stop_min_running_vel: 0.01
    smooth_stop_min_running_acc: 0.01
    smooth_stop_weak_stop_time: 0.8
    smooth_stop_weak_stop_dist: -0.3
    smooth_stop_strong_stop_dist: -0.5
    stopped_vel: 0.0
    emergency_vel: 0.0
    lpf_acc_error_gain: 0.98
    acc_feedback_gain: 0.0
    max_acc: 3.0
    max_jerk: 2.0
    max_acc_cmd_diff: 50.0
    adaptive_trajectory_velocity_th: 1.0
    lpf_pitch_gain: 0.95
    slope_source: raw_pitch

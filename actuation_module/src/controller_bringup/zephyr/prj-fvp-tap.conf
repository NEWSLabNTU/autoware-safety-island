# The FVP on the TAP network. The host side should assign tap0
# 192.168.10.1/24 and run CycloneDDS Domain 2 on that interface. The address
# is not stated here: the tap images name net-fvp-tap.toml, which nros build
# renders into NET_CONFIG_* (192.168.10.2, gateway 192.168.10.1, no DHCP);
# the tap test programs take test/zephyr_app/net-fvp-tap.conf, the rendered
# rows by hand.

# The demo compose stack bridges DDS domain 2 (safety island) <-> 1 (Autoware)
# -- see demo/bridge/bridge-config.yaml. The domain is not stated here: the
# tap build is the bringup's [image.fvp-tap] (domain_id = 2), and nano-ros
# renders CONFIG_NROS_DOMAIN_ID from the image (CONFIG_NROS_CYCLONE_DOMAIN_ID
# follows it by default).

# The wall-clock epoch (SNTP against the tap host, scripts/sntp-server.py on
# 192.168.10.1:12123) is not stated here: the tap images state it in
# [knobs.clock] and [knobs.sntp] (controller_bringup/system.toml). The tap
# test programs, which have no knob rows, stamp boot-relative.

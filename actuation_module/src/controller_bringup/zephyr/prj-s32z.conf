# The CAN control-command output is built in (native FlexCAN); the launch
# arg control_output selects whether it is used.
CONFIG_CONTROL_CMD_CAN_OUTPUT=y

# The S32Z's address: its board declares no interface for a board network
# file, so it keeps Zephyr's net_config with DHCPv4 and the island's own
# CONFIG_NET_IFACE2_* / VLAN bring-up (asi_common network_config.cpp).
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=10

# Network RX thread stack size
CONFIG_ETH_NXP_S32_RX_THREAD_STACK_SIZE=16384

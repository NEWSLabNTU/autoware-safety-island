#
# phase-8 W8 — route the CTF stream to the overwrite-oldest RAM ring instead
# of straight out the UART.
#
# TRACING_BACKEND_UART must be OFF. Zephyr picks the backend with an #elif
# chain in tracing_core.c that tests UART first, so leaving it on silently
# wins and the ring is never selected.
# The backend is a Kconfig CHOICE; `select` does not work on choice members,
# so the choice is made here rather than from ASI_TRACE_RING.
CONFIG_TRACING_BACKEND_UART=n
CONFIG_TRACING_BACKEND_CUSTOM=y
CONFIG_ASI_TRACE_RING=y
CONFIG_TRACING_BACKEND_CUSTOM_NAME="asi_trace_ring"
CONFIG_ASI_TRACE_RING_SIZE=65536
# Small enough that a short run overflows it, which is the case worth testing.
CONFIG_ASI_TRACE_RING_AUTODUMP_S=25

name: Build and Test

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      devcontainer_image:
        description: 'Container image to use for CI jobs'
        required: false
        type: string
        default: 'ghcr.io/autowarefoundation/autoware-safety-island:devcontainer'

jobs:
  build-zephyr:
    name: Zephyr FVP
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.devcontainer_image || 'ghcr.io/autowarefoundation/autoware-safety-island:devcontainer' }}
      # Image USER is `dev` (fixuid pattern for local dev). GHA needs root
      # inside the container so cache extraction + installs work and the
      # workspace bind-mount is freely writable. (nano-ros branch carry-over.)
      options: --user 0:0 --entrypoint=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Trust workspace (container runs as root)
        shell: bash
        run: git config --global --add safe.directory '*'

      # Initialise only the public submodules. s32ct_config is a PRIVATE
      # submodule (NXP Confidential generated configs) that the repo-scoped CI
      # token cannot clone, and the Zephyr/FreeRTOS-POSIX builds do not need it.
      - name: Initialize build submodules (private s32ct_config excluded)
        shell: bash
        run: git submodule update --init --recursive cyclonedds zephyr

      # phase-3 W1 — the Zephyr platforms build on nano-ros: the host `nros`
      # CLI (message codegen + entry orchestration) is a Rust binary built by
      # build.sh's bootstrap hook, and the nano-ros runtime cross-compiles via
      # cargo inside the west build. Mirror bootstrap-asi.sh's rustup step.
      - name: Install Rust toolchain (nano-ros CLI + runtime)
        shell: bash
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore Zephyr workspace cache
        id: zephyr-cache
        uses: actions/cache@v4
        with:
          path: |
            .west
            zephyr
            modules
            actuation_module/zephyr_modules
          key: zephyr-workspace-${{ hashFiles('actuation_module/west.yml') }}
          restore-keys: zephyr-workspace-

      - name: Initialize Zephyr workspace
        shell: bash
        run: |
          set -euo pipefail
          pip3 install -q -r zephyr/scripts/requirements-base.txt
          pip3 install -q -r zephyr/scripts/requirements-build-test.txt
          if [ "${{ steps.zephyr-cache.outputs.cache-hit }}" != "true" ]; then
            [ -d .west ] || west init -l actuation_module
            west update
          fi
          west zephyr-export

      - name: Run Zephyr FVP validation
        shell: bash
        run: .github/scripts/run-zephyr-fvp-ci.sh

      - name: Upload Zephyr FVP logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-fvp-logs
          path: build/zephyr-fvp/logs
          if-no-files-found: ignore
          retention-days: 7

  build-freertos:
    name: FreeRTOS POSIX (nano-ros)
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.devcontainer_image || 'ghcr.io/autowarefoundation/autoware-safety-island:devcontainer' }}
      options: --user 0:0 --entrypoint=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Trust workspace (container runs as root)
        shell: bash
        run: git config --global --add safe.directory '*'

      # Phase-4 W5.a — the lane builds against the nano-ros submodule (the
      # vendored cyclonedds/zephyr trees are not used here). The CLI's
      # play_launch dep is the only nested submodule needed.
      - name: Initialize build submodules
        shell: bash
        run: |
          git submodule update --init modules/nros
          git -C modules/nros submodule update --init packages/cli/third-party/play_launch

      - name: Install Rust toolchain (nano-ros CLI + runtime)
        shell: bash
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore nros CLI + cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            modules/nros/packages/cli/target
            modules/nros/packages/cli/nros-launch-resolve/target
          key: nros-cli-freertos-${{ hashFiles('actuation_module/west.yml') }}
          restore-keys: nros-cli-freertos-

      - name: Run FreeRTOS POSIX validation
        shell: bash
        run: .github/scripts/run-freertos-posix-ci.sh

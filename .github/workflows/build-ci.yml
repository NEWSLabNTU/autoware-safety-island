name: Build CI

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:

jobs:
  build-zephyr:
    name: Zephyr Build (FVP)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/autowarefoundation/autoware-safety-island:devcontainer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Trust workspace (container runs as root)
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Restore Zephyr workspace cache
        id: zephyr-cache
        uses: actions/cache@v4
        with:
          path: |
            .west
            zephyr
            modules
          key: zephyr-workspace-${{ hashFiles('actuation_module/west.yml') }}
          restore-keys: zephyr-workspace-

      - name: Initialize Zephyr workspace
        shell: bash
        run: |
          set -euo pipefail
          pip3 install -q -r zephyr/scripts/requirements-base.txt
          pip3 install -q -r zephyr/scripts/requirements-build-test.txt
          if [ "${{ steps.zephyr-cache.outputs.cache-hit }}" != "true" ]; then
            [ -d .west ] || west init -l actuation_module
            west update
          fi
          west zephyr-export

      - name: Install Rust toolchain (nros codegen)
        uses: dtolnay/rust-toolchain@stable

      - name: Build (FVP target, nano-ros)
        shell: bash
        run: ./build.sh -t fvp_baser_aemv8r_smp

  # FreeRTOS POSIX simulator job retired with the CycloneDDS submodule
  # in Phase 1.3/1.4. Tree under actuation_module/freertos/ is preserved
  # for archaeology; re-enable once it is ported to nano-ros.

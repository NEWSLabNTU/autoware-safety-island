name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify the tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag points to a commit on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Error: tag does not point to a commit reachable from main"
            exit 1
          fi

      - name: Check the changelog has this version
        shell: bash
        run: |
          # A pre-release (v0.2.0-rc.1) is checked against its version (v0.2.0).
          version="${GITHUB_REF_NAME%%-*}"
          if ! grep -qxF "${version}" documentation/changelog.rst; then
            echo "Error: documentation/changelog.rst has no ${version} section"
            exit 1
          fi

      - name: Check the bridge contract matches topics.rst
        shell: bash
        run: python3 .github/scripts/check-bridge-contract.py

  build-zephyr:
    name: Zephyr Build (${{ matrix.name }})
    needs: verify-tag
    runs-on: ubuntu-24.04
    container:
      # Pinned, so a tag always builds with the same toolchain. Move it to the
      # devcontainer-<sha> tag docker-build-push.yml published when .devcontainer changes.
      image: ghcr.io/autowarefoundation/autoware-safety-island:devcontainer-c92271b605bb3af960fdaffdedbe96e11efb4543
      # Image USER is `dev` (fixuid). GHA needs root in the container.
      options: --user 0:0 --entrypoint=
    strategy:
      matrix:
        include:
          - platform: zephyr-fvp
            name: FVP
            artifact: zephyr-fvp.elf
            elf: build/zephyr-fvp/full/zephyr/zephyr.elf
          - platform: zephyr-s32z
            name: S32Z
            artifact: zephyr-s32z.elf
            elf: build/zephyr-s32z/zephyr/zephyr.elf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Trust workspace (container runs as root)
        shell: bash
        run: git config --global --add safe.directory '*'

      # Initialise only the public submodules. s32ct_config is a PRIVATE
      # submodule (NXP Confidential generated configs) that the repo-scoped CI
      # token cannot clone, and the Zephyr/FreeRTOS-POSIX builds do not need it.
      - name: Initialize build submodules (private s32ct_config excluded)
        shell: bash
        run: git submodule update --init --recursive zephyr

      # phase-3 W1 — the Zephyr platforms build on nano-ros (host `nros` CLI
      # + cargo cross-compile inside the west build). Mirror bootstrap-asi.sh.
      - name: Install Rust toolchain (nano-ros CLI + runtime)
        shell: bash
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # nano-ros's prebuilt SDK dists are .tar.zst; the devcontainer has no zstd.
      - name: Install zstd (nano-ros SDK dists are .tar.zst)
        shell: bash
        run: |
          command -v zstd >/dev/null 2>&1 || {
            apt-get update -qq && apt-get install -y -qq zstd
          }

      - name: Initialize Zephyr workspace
        shell: bash
        run: |
          set -euo pipefail
          pip3 install -q -r zephyr/scripts/requirements-base.txt
          pip3 install -q -r zephyr/scripts/requirements-build-test.txt
          west init -l actuation_module
          west update
          west zephyr-export

      # As build-ci.yml: west clones nano-ros as a manifest project and leaves
      # its own submodules empty; the Zephyr build needs the CycloneDDS backend
      # and the CLI's play_launch dep.
      - name: Initialize nano-ros submodules (CycloneDDS backend)
        shell: bash
        run: |
          set -euo pipefail
          git -C modules/nros submodule update --init --recursive third-party/dds/cyclonedds
          git -C modules/nros submodule update --init packages/cli/third-party/play_launch

      # Both Zephyr targets cross-compile the nano-ros runtime: AArch64 for the
      # FVP, ARMv8-R for the S32Z270 RTU.
      - name: Add the Rust cross targets
        shell: bash
        run: |
          tc="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' modules/nros/rust-toolchain.toml)"
          rustup toolchain install "${tc}" --profile minimal
          for t in aarch64-unknown-none armv8r-none-eabihf; do
            rustup target add --toolchain "${tc}" "${t}"
            rustup target add "${t}"
          done

      # run-zephyr-fvp-ci.sh does these itself; the S32Z build calls build.sh
      # directly, so it needs the CLI, corrosion and the zephyr-lang-rust
      # patch hunks first (the same steps as that script's Phase 0).
      - name: Prepare the nano-ros CLI and Zephyr patches (S32Z)
        if: matrix.platform == 'zephyr-s32z'
        shell: bash
        run: |
          set -euo pipefail
          NROS=modules/nros
          cargo build --release --manifest-path "${NROS}/packages/cli/nros-launch-resolve/Cargo.toml"
          mkdir -p "${NROS}/packages/cli/target/release"
          ln -sf "$PWD/${NROS}/packages/cli/nros-launch-resolve/target/release/nros-launch-resolve" \
                 "${NROS}/packages/cli/target/release/nros-launch-resolve"
          cargo build --release --manifest-path "${NROS}/packages/cli/Cargo.toml" -p nros-cli
          ( cd actuation_module && "../${NROS}/packages/cli/target/release/nros" setup \
              --index "../${NROS}/nros-sdk-index.toml" --tool corrosion )
          bash "${NROS}/scripts/zephyr/patches/3.7.sh" "$PWD"

      # Builds the ELF it publishes and runs it; S32Z needs hardware to run.
      - name: Build and validate on FVP
        if: matrix.platform == 'zephyr-fvp'
        shell: bash
        run: .github/scripts/run-zephyr-fvp-ci.sh

      - name: Build for S32Z
        if: matrix.platform == 'zephyr-s32z'
        shell: bash
        run: ./build.sh --platform zephyr-s32z

      - name: Collect artifact
        shell: bash
        run: cp "${{ matrix.elf }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  build-freertos:
    name: FreeRTOS POSIX Runtime Build
    needs: verify-tag
    runs-on: ubuntu-24.04
    container:
      # Pinned, so a tag always builds with the same toolchain. Move it to the
      # devcontainer-<sha> tag docker-build-push.yml published when .devcontainer changes.
      image: ghcr.io/autowarefoundation/autoware-safety-island:devcontainer-c92271b605bb3af960fdaffdedbe96e11efb4543
      # Image USER is `dev` (fixuid). GHA needs root in the container.
      options: --user 0:0 --entrypoint=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Trust workspace (container runs as root)
        shell: bash
        run: git config --global --add safe.directory '*'

      # Initialise only the public submodules. s32ct_config is a PRIVATE
      # submodule (NXP Confidential generated configs) that the repo-scoped CI
      # token cannot clone, and the Zephyr/FreeRTOS-POSIX builds do not need it.
      # The nano-ros lane builds against the nano-ros submodule; the CLI's
      # play_launch dep is the only nested submodule it needs (as build-ci.yml).
      - name: Initialize build submodules
        shell: bash
        run: |
          git submodule update --init modules/nros
          git -C modules/nros submodule update --init packages/cli/third-party/play_launch

      # nano-ros's prebuilt SDK dists are .tar.zst; the devcontainer has no zstd.
      - name: Install zstd (nano-ros SDK dists are .tar.zst)
        shell: bash
        run: |
          command -v zstd >/dev/null 2>&1 || {
            apt-get update -qq && apt-get install -y -qq zstd
          }

      - name: Install Rust toolchain (nano-ros CLI + runtime)
        shell: bash
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run FreeRTOS POSIX validation
        shell: bash
        run: .github/scripts/run-freertos-posix-ci.sh

      # The nano-ros entry links CycloneDDS from the nano-ros SDK store
      # (libddsc.so.0); a plain Ubuntu host has neither, so the library ships
      # beside the binary and the smoke job puts that directory on the loader
      # path. The binary keeps upstream's release name.
      - name: Stage the binary and its CycloneDDS library
        shell: bash
        run: |
          set -euo pipefail
          out=build/freertos-posix/release
          mkdir -p "${out}"
          cp build/freertos-posix/src/freertos_posix_entry/actuation_posix_entry \
             "${out}/actuation_freertos"
          ddsc="$(ldd "${out}/actuation_freertos" | awk '$1 == "libddsc.so.0" { print $3 }')"
          test -n "${ddsc}"
          cp -L "${ddsc}" "${out}/libddsc.so.0"
          ls -l "${out}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freertos-posix
          path: build/freertos-posix/release/
          retention-days: 1

  smoke-freertos:
    # The released POSIX binary must start on a plain Ubuntu host, not only in
    # the devcontainer it was built in: pin the glibc floor (22.04) and the
    # current LTS (24.04), on the default loopback interface and with the
    # SI_DDS_INTERFACE runtime override.
    name: FreeRTOS POSIX smoke (${{ matrix.image }})
    needs: build-freertos
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04']

    steps:
      - name: Download FreeRTOS POSIX binary
        uses: actions/download-artifact@v4
        with:
          name: freertos-posix
          path: bin/

      - name: Run on ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/actuation_freertos
          for env in "" "SI_DDS_INTERFACE=lo" "SI_DDS_INTERFACE=auto"; do
            echo "::group::${{ matrix.image }} ${env:-<default>}"
            set +e
            env_args=()
            [ -n "$env" ] && env_args=(-e "$env")
            docker run --rm -v "$PWD/bin:/si:ro" -e LD_LIBRARY_PATH=/si "${env_args[@]}" \
              "${{ matrix.image }}" timeout 15s /si/actuation_freertos > run.log 2>&1
            rc=$?
            set -e
            cat run.log
            echo "::endgroup::"
            # 124 = still running when timeout stopped it, which is the pass case.
            if [ "$rc" -ne 124 ]; then
              echo "actuation_freertos exited early with status ${rc} on ${{ matrix.image }} (${env:-default})" >&2
              exit 1
            fi
            grep -Fq "Network interface" run.log
            grep -Fq "Actuation Safety Island is Live" run.log
            grep -Eq "Waiting for .* data" run.log
          done

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-zephyr, build-freertos, smoke-freertos]
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release/

      # The Safety Island's bridge contract: bridge-config.yaml (topics) and
      # cyclonedds-domain2.xml (the MaxMessageSize every domain-2 writer must
      # use). Downstream integrations (Open AD Kit) pin both by release +
      # sha256 instead of copying them.
      - name: Collect bridge contract
        shell: bash
        run: |
          cp demo/bridge/bridge-config.yaml release/bridge-config.yaml
          cp demo/bridge/cyclonedds-domain2.xml release/cyclonedds-domain2.xml

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum -- * > sha256sums.txt
          cat sha256sums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "Release ${{ github.ref_name }}" \
            --verify-tag \
            --prerelease="${{ contains(github.ref_name, '-') }}" \
            --generate-notes

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag points to a commit on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Error: tag does not point to a commit reachable from main"
            exit 1
          fi

  build-zephyr:
    name: Zephyr Build (${{ matrix.name }})
    needs: verify-tag
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/autowarefoundation/autoware-safety-island:devcontainer
      # Image USER is `dev` (fixuid pattern for local dev). GHA needs
      # root inside the container so cache extraction + apt installs
      # work and the workspace bind-mount is freely writable.
      options: --user 0:0 --entrypoint=
    strategy:
      matrix:
        include:
          - target: fvp_baser_aemv8r_smp
            name: FVP
            artifact: zephyr-fvp.elf
          - target: s32z270dc2_rtu0_r52@D
            name: S32Z
            artifact: zephyr-s32z.elf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Trust workspace (container runs as root)
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Restore Zephyr workspace cache
        id: zephyr-cache
        uses: actions/cache@v4
        with:
          path: |
            .west
            zephyr
            modules
          key: zephyr-workspace-${{ hashFiles('actuation_module/west.yml') }}
          restore-keys: zephyr-workspace-

      - name: Initialize Zephyr workspace
        shell: bash
        run: |
          set -euo pipefail
          pip3 install -q -r zephyr/scripts/requirements-base.txt
          pip3 install -q -r zephyr/scripts/requirements-build-test.txt
          if [ "${{ steps.zephyr-cache.outputs.cache-hit }}" != "true" ]; then
            [ -d .west ] || west init -l actuation_module
            west update
          fi
          west zephyr-export

      - name: Install Rust toolchain (nros codegen)
        uses: dtolnay/rust-toolchain@stable

      - name: Build (${{ matrix.name }} target, nano-ros)
        shell: bash
        run: ./build.sh -t "${{ matrix.target }}"

      - name: Collect artifact
        shell: bash
        run: cp build/actuation_module/zephyr/zephyr.elf "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-zephyr]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release/

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum zephyr-fvp.elf zephyr-s32z.elf > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/zephyr-fvp.elf \
            release/zephyr-s32z.elf \
            release/sha256sums.txt \
            --repo "${{ github.repository }}" \
            --title "Release ${{ github.ref_name }}" \
            --verify-tag \
            --generate-notes

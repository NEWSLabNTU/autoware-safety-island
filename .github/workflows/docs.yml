name: Build and Deploy Documentation

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'docs/**'
  # Allow manual triggering
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build documentation
        run: |
          cd docs
          sphinx-build -b html . _build/html
        env:
          # Treat warnings as errors for clean builds
          SPHINXOPTS: "-W --keep-going"

      # PUBLISHING is gated; BUILDING is not. This repo is a fork, and a fork has
      # no Pages site unless someone enables one, so `actions/configure-pages`
      # failed every run:
      #
      #   Get Pages site failed. Please verify that the repository has Pages
      #   enabled and configured to build using GitHub Actions
      #
      # A workflow that is red for a reason unrelated to its subject teaches
      # people to ignore it, and `sphinx-build -W` above is a real check worth
      # keeping green. The canonical repo still publishes; a fork opts in by
      # enabling Pages and setting the PUBLISH_DOCS repository variable.
      - name: Setup Pages
        if: github.event_name != 'pull_request' && (github.repository == 'autowarefoundation/autoware-safety-island' || vars.PUBLISH_DOCS == 'true')
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request' && (github.repository == 'autowarefoundation/autoware-safety-island' || vars.PUBLISH_DOCS == 'true')
        uses: actions/upload-pages-artifact@v4
        with:
          path: './docs/_build/html'

  # Deployment job (only runs on push to main/master, not on PRs)
  deploy:
    # Same gate as the upload above: with nothing uploaded there is nothing to
    # deploy, and this job would fail looking for the artifact.
    if: github.event_name != 'pull_request' && (github.repository == 'autowarefoundation/autoware-safety-island' || vars.PUBLISH_DOCS == 'true')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 
